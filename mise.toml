[tools]
go = "1.27.3"
hadolint = "2.14.0"
imagemagick = "7.1.2_31"
node = "26.3.1"
"npm:agent-browser" = "latest"
pnpm = "12.3.4"
python = "3.13"
uv = "0.10.10"

[env]
_.file = "instance/local.env"

[task_config]
includes = ["scripts", "backend/scripts", "frontend/scripts", "icon/scripts", "cli/scripts"]

[tasks."build:icon-bundle"]
description = "Build icon + social preview images"
depends = ["build:icon", "build:og-image"]

[tasks.start]
description = "Start all dev servers"
depends = ["start:backend", "start:frontend"]

[tasks."setup:db"]
description = "Setup empty database for local development, DO NOT use this in production, data will NOT persist!"
run = ["mise run start:db", "mise run db:upgrade"]
