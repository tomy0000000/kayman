# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "tomy0000000"
    commit-message:
      prefix: "⬆️ [bump] "
    target-branch: "develop"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "tomy0000000"
    commit-message:
      prefix: "⬆️ [bump][ci] "
    target-branch: "develop"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "npm"
    directory: "frontend"
    schedule:
      interval: "daily"
    assignees:
      - "tomy0000000"
    commit-message:
      prefix: "⬆️ [bump][frontend] "
    target-branch: "develop"

  - package-ecosystem: "uv"
    directory: "backend"
    schedule:
      interval: "daily"
    assignees:
      - "tomy0000000"
    commit-message:
      prefix: "⬆️ [bump][backend] "
    target-branch: "develop"

  - package-ecosystem: "npm"
    directory: "icon"
    schedule:
      interval: "daily"
    assignees:
      - "tomy0000000"
    commit-message:
      prefix: "⬆️ [bump][icon] "
    target-branch: "develop"
