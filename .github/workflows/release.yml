name: "🔖 Release"

on:
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.31.1 (defaults to the next minor)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  draft:
    name: "📝 Draft Release"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: "🛒 Checkout"
        uses: actions/checkout@v7
        with:
          ref: "develop"
          fetch-depth: 0

      - name: "🔢 Compute Version"
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: scripts/release/next-version.sh "$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: "🤖 Draft Notes"
        if: steps.version.outputs.version
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Run the release-notes skill. Write the notes to /tmp/kayman-release-${{ steps.version.outputs.version }}.md."
          claude_args: |
            --allowedTools "Skill,Read,Write,Bash(git fetch:*),Bash(git describe:*),Bash(git log:*),Bash(gh release view:*)"

      - name: "📦 Create Draft Release"
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: scripts/release/draft.sh "$VERSION" "$SHA" "/tmp/kayman-release-$VERSION.md"

  publish:
    name: "🔖 Publish Release"
    needs: draft
    if: needs.draft.outputs.version
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - name: "🛒 Checkout"
        uses: actions/checkout@v7
        with:
          ref: "develop"
          fetch-depth: 0

      - name: "🐍 Install uv"
        uses: astral-sh/setup-uv@v7

      - name: "🔖 Bump Version"
        env:
          SHA: ${{ needs.draft.outputs.sha }}
        run: scripts/release/bump.sh "$VERSION" "$SHA"

      - name: "⬆️ Push"
        run: git push --atomic origin main develop

      - name: "🚀 Publish"
        run: gh release edit "$VERSION" --draft=false --prerelease=false --target main

  image:
    name: "🏞️ Publish Image"
    needs: [draft, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "🛒 Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.version }}

      - name: "🔍 Resolve Commit"
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "⚙️ Setup Docker Meta"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{major}},value=${{ needs.draft.outputs.version }},enable=${{ !startsWith(needs.draft.outputs.version, '0.') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.draft.outputs.version }}
            type=semver,pattern={{version}},value=${{ needs.draft.outputs.version }}

      - name: "🏗 Build and Push Image"
        uses: tomy0000000/actions/build-push-image@main
        with:
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build_args: COMMIT_SHA=${{ steps.commit.outputs.sha }}

  update-docker-readme:
    name: "📖 Update Docker Hub README"
    runs-on: ubuntu-latest
    needs: image
    steps:
      - name: "🛒 Checkout"
        uses: actions/checkout@v7

      # Scheduled runs carry no repository payload, so read the description from the API.
      - name: "🔍 Read Repo Description"
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "description=$(gh repo view "$GITHUB_REPOSITORY" --json description --jq .description)" >> "$GITHUB_OUTPUT"

      - name: "📖 Update Description"
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          short-description: ${{ steps.repo.outputs.description }}
